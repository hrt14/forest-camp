name: Forest camp historical path investigation
on:
  push:
    branches: [security/privacy-audit-20260919]
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify historical files without printing sensitive contents
        run: |
          python3 - <<'PY'
          import json,re,subprocess
          def git(*a):return subprocess.check_output(['git',*a],stderr=subprocess.DEVNULL)
          current={x.split(b'\t',1)[0].split()[2].decode() for x in git('ls-tree','-r','-z','main').split(b'\0') if x and x.split(b'\t',1)[0].split()[1]==b'blob'}
          pat=re.compile(rb'(?i)(?:/Users/[^/\s]+/|[A-Z]:\\Users\\[^\\\s]+\\)')
          results=[]
          for line in git('rev-list','--objects','main').decode('utf8','replace').splitlines():
            oid,*rest=line.split(' ',1)
            if oid in current or not rest:continue
            if git('cat-file','-t',oid).strip()!=b'blob':continue
            if int(git('cat-file','-s',oid))>1000000:continue
            data=git('cat-file','-p',oid)
            if b'\0' in data or not pat.search(data):continue
            filepath=rest[0]
            safe=filepath if re.fullmatch('[A-Za-z0-9_./-]+',filepath) else '(non-ASCII path)'
            matches=pat.findall(data)
            redacted_example=all(any(w in m.lower() for w in (b'example',b'<user>',b'username',b'john',b'jane',b'YOUR_USER'.lower())) for m in matches)
            results.append({'path':safe,'blob_sha':oid,'match_count':len(matches),'obvious_placeholder_only':redacted_example})
          print(json.dumps({'historical_path_candidates':results,'never_prints_matched_path_values':True},sort_keys=True))
          PY